<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PharmaSee test harness</title>
<style>
  :root { --bg: #fafaf8; --fg: #1c1c1a; --muted: #6b6b66; --card: #fff; --line: #e4e4de; --accent: #1f6f4a; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ecece8; --muted: #9a9a94; --card: #1e1e1c; --line: #34342f; --accent: #5cc796; --bad: #f2877f; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; flex: 1 1 280px; }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  video { width: 100%; background: #000; border-radius: 6px; aspect-ratio: 16 / 9; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--fg); }
  button:disabled { opacity: .5; cursor: default; }
  label { margin-left: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .status { font-weight: 600; }
  .status.taken { color: var(--accent); }
  .status.wrong_medication_flagged, .status.unconfirmed { color: var(--bad); }
  #log { height: 190px; overflow: auto; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  .bar { margin-bottom: 16px; }
</style>
</head>
<body>
<main>
  <h1>PharmaSee test harness</h1>
  <p class="sub">Talks to the agent straight through LiveKit (no Chert, no FaceTime). Use headphones to avoid echo.</p>
  <div class="bar">
    <button id="start">Start call</button>
    <button id="stop" class="ghost" disabled>Hang up</button>
    <label><input type="checkbox" id="cam" checked> Camera on</label>
  </div>
  <div class="row">
    <div class="card"><h2>Agent</h2><div id="agentVideo"></div></div>
    <div class="card"><h2>You (what the agent sees)</h2><video id="local" muted playsinline autoplay></video></div>
  </div>
  <div class="row" style="margin-top:16px">
    <div class="card"><h2>Doses in this call</h2><table><tbody id="doses"><tr><td>Not started</td></tr></tbody></table></div>
    <div class="card"><h2>Events</h2><div id="log"></div></div>
  </div>
</main>
<script src="/livekit-client.js"></script>
<script>
  const LK = window.LivekitClient;
  const $ = id => document.getElementById(id);
  let room, poll;

  const log = text => { const line = document.createElement('div'); line.textContent = `${new Date().toLocaleTimeString()}  ${text}`; $('log').appendChild(line); $('log').scrollTop = $('log').scrollHeight; };

  async function refreshDoses() {
    try {
      const rows = await (await fetch('/doses')).json();
      const body = $('doses');
      body.replaceChildren();
      for (const row of rows) {
        const tr = document.createElement('tr');
        const name = document.createElement('td'); name.textContent = `${row.name} - ${row.dosage}`;
        const status = document.createElement('td'); status.textContent = row.status; status.className = `status ${row.status}`;
        tr.append(name, status);
        body.appendChild(tr);
      }
    } catch { /* the next poll will retry */ }
  }

  $('start').onclick = async () => {
    $('start').disabled = true;
    try {
      const session = await (await fetch('/session', { method: 'POST' })).json();
      if (session.error) throw new Error(session.error);
      room = new LK.Room();
      room.on(LK.RoomEvent.TrackSubscribed, track => {
        if (track.kind === 'audio') document.body.appendChild(track.attach());
        if (track.kind === 'video') $('agentVideo').replaceChildren(track.attach());
        log(`agent ${track.kind} track received`);
      });
      room.on(LK.RoomEvent.ParticipantConnected, p => log(`joined: ${p.identity}`));
      room.on(LK.RoomEvent.ParticipantDisconnected, p => log(`left: ${p.identity}`));
      room.on(LK.RoomEvent.Disconnected, () => { log('disconnected'); $('start').disabled = false; $('stop').disabled = true; clearInterval(poll); refreshDoses(); });
      await room.connect(session.url, session.token);
      await room.startAudio();
      log(`connected to ${session.room}; the agent greets about 2 seconds after your microphone starts`);
      await room.localParticipant.setMicrophoneEnabled(true);
      if ($('cam').checked) {
        const publication = await room.localParticipant.setCameraEnabled(true);
        if (publication?.track) { $('local').srcObject = new MediaStream([publication.track.mediaStreamTrack]); }
      }
      $('stop').disabled = false;
      refreshDoses();
      poll = setInterval(refreshDoses, 2000);
    } catch (error) {
      log(`error: ${error.message}`);
      $('start').disabled = false;
    }
  };

  $('stop').onclick = () => room?.disconnect();
</script>
</body>
</html>
